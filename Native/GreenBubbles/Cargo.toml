[package]
name = "greenbubbles"
version = "0.10.0"
edition = "2021"
default-run = "greenbubbles"
description = "Local-first WeChat history query, snapshot, restoration, and AI context engine"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/bojieli/greenbubbles"
publish = false

[dependencies]
argon2 = "0.5"
base64 = "0.23"
bip39 = { version = "2.2", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
libc = "0.2"
md5 = "0.8"
prost = "0.14"
rusqlite = { version = "0.40", features = ["backup", "bundled-sqlcipher", "hooks"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "0.9"
ureq = { version = "2.12", features = ["json"] }
walkdir = "2"
zeroize = { version = "1", features = ["derive"] }
zstd = "0.13"
wx-db = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-context = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-decrypt = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
wx-media = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74" }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }

# SILK voice transcoding builds C code through bindgen 0.59, which fails on
# current Windows headers. Without the feature voice notes stay lossless SILK.
[target.'cfg(not(windows))'.dependencies]
wx-media = { git = "https://github.com/pandorafuture/wx-cli", rev = "2abe708f55bfe135539a385df856fdc58f97fc74", features = ["audio"] }

# Windows has no system OpenSSL for SQLCipher to link, so build one in.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
filetime = "0.2"
